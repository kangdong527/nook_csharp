name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소 (Actions 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / build / audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 세 검증은 서로 독립이라 하나가 실패해도 나머지 결과를 함께 보고 싶다.
      # 단계별로 나누되 continue-on-error 는 쓰지 않는다(실패는 실패로 남긴다).
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # env 미설정이어도 빌드가 통과하도록 lib/supabase.ts 가 placeholder 를 쓰므로
      # CI 에 시크릿을 주입하지 않는다. (실제 값은 Vercel 에서만 관리)
      - name: Build
        run: npm run build

      # ── 의존성 취약점 현황 (참고용 — 빌드를 실패시키지 않는다) ──────────
      #
      # 왜 실패시키지 않는가: next@14.2.x 자체에 high 권고가 남아 있고 해소에는
      #   next@16(major) 업그레이드가 필요하다. 차단으로 두면 모든 PR 이 영구히 막힌다.
      #
      # 왜 별도 job 이 아니라 여기의 step 인가: job 에 continue-on-error 를 걸면
      #   워크플로 전체는 성공이지만 **그 job 의 check run 은 실패로 보고**되어
      #   커밋·PR 에 빨간 X 가 남는다. 상시 X 는 "무시해도 되는 신호"를 학습시켜
      #   진짜 실패를 놓치게 만든다. step 으로 내리고 `|| echo ::warning::` 을 쓰면
      #   종료코드 0 → 커밋은 초록, 대신 **노란 경고 애노테이션**으로 가시성을 유지한다.
      #
      # high 이상만 본다. moderate 이하까지 보면 1인 개발에서 무시하게 되고,
      #   무시되는 게이트는 없는 게이트다. (개발_운영_전략.md §4-9 와 동일한 판단)
      #
      # ⚠️ 이 step 은 `.github/dependabot.yml` 의 major `ignore` 목록이
      #   "사각지대가 아니다"라고 주장하는 근거다. 이 step 을 제거하거나
      #   출력을 무음화하면 그 ignore 목록도 함께 재검토해야 한다.
      #
      # Next major 업그레이드 완료 후: `|| echo …` 를 지워 차단 게이트로 승격.
      #   (docs/진행내역.md D-2 체크리스트 마지막 항목)
      - name: Dependency audit (참고용)
        run: |
          npm audit --audit-level=high \
            || echo "::warning title=의존성 취약점 잔존::high 이상 권고가 남아 있습니다. next@16 업그레이드 전까지는 예상된 상태입니다 — docs/진행내역.md D-2 참조. 위 로그에서 next 이외의 패키지가 보이면 새로운 문제입니다."
