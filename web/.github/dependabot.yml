version: 2

updates:
  # npm 의존성 — 보안 패치 추적이 주 목적 (Next.js 14.2.x 등)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # 1인 개발에는 주간이 과하다. 월간으로도 보안 인지에 충분하며,
      # 매 PR 마다 CI 의 Dependency audit step 이 현황을 별도로 보고한다.
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

    # minor/patch 는 하나로 묶어 PR 홍수를 막는다.
    # major 는 개별 PR로 두어 파괴적 변경을 따로 검토한다.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    # ── major 무시 목록 ──────────────────────────────────────────────
    # 아래는 "언젠가 올려야 하지만 Dependabot 이 알려줄 필요가 없는" 것들이다.
    # 전부 계획된 마이그레이션이거나 다른 것과 함께 올려야 하는 항목이라,
    # 개별 PR 이 열려도 머지할 수 없고 CI 분만 소모한다.
    #
    # ⚠️ ignore 는 버전 업데이트뿐 아니라 해당 의존성의 **보안 업데이트도 억제**한다.
    #    사각지대가 되지 않는 근거: CI(`ci.yml`)의 **Dependency audit step** 이
    #    매 PR 마다 현황을 로그+경고 애노테이션으로 보고하고,
    #    next 는 docs/진행내역.md D-2 로 별도 추적한다.
    #    이 안전망(audit step)을 제거·무음화한다면 이 ignore 목록도 함께 재검토해야 한다.
    # 각 항목의 "해제 시점"은 날짜가 아니라 **조건(트리거)** 으로 적는다.
    # 해제 = 아래 항목을 지우는 것. 그러면 그 세대 기준으로 다시 알림을 받는다.
    # (ignore 는 영구 차단이 아니라 "이 세대는 건너뛴다"는 표시다)
    ignore:
      # D-2 에서 시점·체크리스트까지 정해 관리 중
      # 해제 시점: Phase 2 말 — 배포 파이프라인(2-12) 확립 후, ZAP 스캔(2-13) 전.
      #   롤백 경로가 있어야 major 를 안전하게 검증·되돌릴 수 있고,
      #   ZAP 은 실제 출시 산출물을 스캔해야 의미가 있다.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 와 버전을 맞춰야 하므로 next 와 함께만 올린다
      # 해제 시점: next 와 **같은 PR**. 버전이 어긋나면 lint 설정이 깨진다.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # v4 는 엔진·설정 형식이 전면 변경됨 → 전용 마이그레이션 작업 필요
      # 해제 시점: Phase 3 이후 **UI 작업이 적은 시기**. 화면 전수 확인이 필요하다.
      #   v4 기능이 필요해지지 않으면 계속 미뤄도 무해하다(보안 이슈가 아님).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # v9+ 는 flat config 를 강제해 .eslintrc.json 이 깨진다
      # 해제 시점: next 업그레이드와 **함께 검토**. eslint-config-next@16 이
      #   flat config 를 요구·지원할 가능성이 커서, 그때 한 번에 옮기는 것이 효율적.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # CI 런타임(actions/setup-node 의 node-version)과 맞춰서만 올린다
      # 해제 시점: **CI Node 버전을 올릴 때 동시에**(현재 20 → 22/24 LTS).
      #   런타임과 타입은 항상 같은 세대로 유지한다. 단독 승격은 무의미하다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # major 는 타입 체크 결과가 달라져 tsc --noEmit 이 갑자기 실패할 수 있고,
      # @types/* · eslint-config-next 와 버전 궁합도 맞춰야 한다 → 단독 승격 금지
      # 해제 시점: **Next 16 정착 후 별도 작업 단위**로. tsc --noEmit 통과를
      #   확인하며 단독 PR 로 진행한다. 급하지 않다(보안 이슈가 아님).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # react 계열 4종 — Next 14 는 React 19 를 지원하지 않는다(지원은 15 부터).
      # 처음에는 "next@16 때 알림을 받자"며 일부러 제외했으나, 실제로는
      # 머지 불가 시점에 알림이 오고 react 를 닫으면 react-dom 이 따로 열려
      # 매달 정리 대상이 됐다. 열린 PR 은 limit(3)을 점유해 정작 필요한
      # 패치 묶음을 막는다 → D-4 에서 (A) 채택, ignore 로 이동.
      # 해제 시점: next 와 **같은 PR**. 4종을 여기서 함께 지운다.
      #   리마인더는 D-2 업그레이드 체크리스트가 대신한다(알림 불필요).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    #
    # 무시 목록의 판단 기준: "다른 것과 함께 올려야만 하는가?"
    #   함께 올려야 함(→ ignore)  : next, eslint-config-next, tailwindcss, eslint,
    #                              @types/node, typescript,
    #                              react, react-dom, @types/react, @types/react-dom
    #   단독으로 올려도 됨(→ 알림) : @supabase/*, postcss, autoprefixer

  # GitHub Actions 버전 추적 (actions/checkout, setup-node 등)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    # Actions 는 major 도 대체로 안전하고 개수가 적으므로 하나로 묶는다.
    groups:
      actions:
        patterns: ["*"]
