# 배포용 compose — caddy → web(Next BFF) → api(C#) → db(PostgreSQL). DEP 2단계, Claude 초안.
# 루트 compose.yaml(개발용 DB만)과 별개다. 프로젝트 이름이 달라 볼륨도 따로 쓴다.
#
# 사용(리포 루트에서):
#   cp deploy/.env.example deploy/.env   → 값 채우기
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml logs -f api      # 로그인 링크는 여기 찍힌다(Email:Provider=Console)
#
# 네트워크: edge(caddy·web) / backend(web·api·migrate·db). caddy 는 api·db 에 닿지 못하고, 호스트로 열린 포트는 caddy 하나뿐.
name: nook-deploy

x-db-connection: &db-connection
  ConnectionStrings__Nook: "Host=db;Port=5432;Database=${POSTGRES_DB:-nook};Username=${POSTGRES_USER:-nook};Password=${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 설정하세요}"

# 마이그레이션 번들도 Program.cs 를 Build 직전까지 실행해 DbContext 를 만든다 → 구현체 선택(fail-fast)을 통과할 값이 필요하다
x-providers: &providers
  Email__Provider: Console
  ImageStorage__Provider: LocalDisk
  ImageStorage__LocalRoot: /app/data/images
  # X-Forwarded-For를 믿을 대역 = backend 서브넷(web이 api를 부르는 곳). 아래 networks.backend.ipam과 같아야 한다
  ForwardedHeaders__KnownNetworks: 10.89.0.0/24

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nook}
      POSTGRES_USER: ${POSTGRES_USER:-nook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 설정하세요}
    # ports 없음 — DB 는 backend 네트워크 안에서만 보인다
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 1회성: 마이그레이션 적용 후 종료(exit 0). api 는 이것이 성공해야 뜬다
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: migrate
    environment:
      <<: [*db-connection, *providers]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: [*db-connection, *providers]
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?deploy/.env에 JWT_SIGNING_KEY(32바이트 이상)를 설정하세요}
      MagicLink__LinkBaseUrl: ${NOOK_PUBLIC_ORIGIN:?deploy/.env에 NOOK_PUBLIC_ORIGIN을 설정하세요}/auth/magic-link
    volumes:
      - images:/app/data/images
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    environment:
      NOOK_API_URL: http://api:8080
      # BFF Origin 검사의 허용 출처 — 브라우저 주소창의 출처와 같아야 한다(dep-plan §4). 없으면 운영에서 POST 전부 403
      NOOK_PUBLIC_ORIGIN: ${NOOK_PUBLIC_ORIGIN:?deploy/.env에 NOOK_PUBLIC_ORIGIN을 설정하세요}
    networks: [edge, backend]
    depends_on: [api]
    read_only: true
    # next/image 최적화 캐시만 쓰기 허용(node = UID 1000)
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?deploy/.env에 SITE_ADDRESS를 설정하세요}
    ports:
      # 로컬: 127.0.0.1 에만. 운영(5단계)에선 80·443 을 연다 — override 파일로 분리 예정
      - "127.0.0.1:3300:3300"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web]

networks:
  edge:
  backend:
    internal: true # 바깥(인터넷)으로 나가는 경로 없음 — 7단계 SES·S3 호출이 생기면 api 만 egress 네트워크에 추가
    # 서브넷 고정: api의 ForwardedHeaders__KnownNetworks가 이 대역만 믿는다(자동 할당이면 재생성 때 바뀐다).
    # 10.89/24 — Docker 기본 풀(172.17~31·192.168)·AWS 기본 VPC(172.31/16, DNS 172.31.0.2)와 겹치지 않게
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
