# dnf-automatic.timer 덮어쓰기(drop-in). DEP 10단계, Claude 작성(2026-11-13). 결정(사용자): ① dnf-automatic
# 기본은 06:00 + 무작위 최대 60분 '서버 시각(UTC)' = 15~16시 KST(사용 시간대) → 새벽으로 옮긴다.
# 06:30 KST = 04:00 백업, 05:00~06:00 DLM 스냅샷 뒤(문제가 생겨도 직전 백업이 있다), 07:00 Backup check 전.
[Timer]
# 빈 값으로 기본 OnCalendar 를 먼저 지운다 — 안 지우면 두 시각 모두 돈다
OnCalendar=
OnCalendar=*-*-* 06:30:00 Asia/Seoul
RandomizedDelaySec=10m
Persistent=true
