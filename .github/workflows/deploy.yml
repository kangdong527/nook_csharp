# 배포 — DEP 8단계, Claude 작성(2026-11-10). 결정 D8-1~5 는 docs/design/dep-plan.md 8행.
#   main 의 CI 가 성공하면(D8-5) → arm64 네이티브 빌드(D8-2) → Trivy → ECR push(불변 sha 태그, D8-3)
#   → SSM 문서 nook-deploy 로 "이 sha 배포"(D8-4) → 서버가 nook-deploy:<sha> 를 꺼내 deploy.sh 실행(D8-1)
# GitHub 에 장기 AWS 키·서버 비밀값 없음. 리포 변수(Settings → Secrets and variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN, NOOK_INSTANCE_ID, KAKAO_MAP_KEY(공개 값 — 브라우저 번들에 들어감)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # 수동 재배포. 신뢰 정책이 main 만 받으므로 다른 브랜치에서 누르면 역할 획득에서 실패한다

# 배포는 한 번에 하나. 진행 중인 배포를 취소하지 않고 다음 것을 기다리게 한다(중간에 끊긴 배포가 더 위험)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# id-token: write = OIDC 토큰 요청 권한. 이 워크플로에만 준다(ci.yml 은 contents: read 만 → 배포 역할을 못 받는다)
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy — build / scan / push / SSM
    # workflow_run 은 포크 PR 의 CI 로도 열린다(head_branch 이름이 main 인 포크) → 이 리포의 push 로 돈 CI 만 받는다
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      AWS_REGION: ap-northeast-2
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Check repository variables
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE: ${{ vars.NOOK_INSTANCE_ID }}
          KAKAO: ${{ vars.KAKAO_MAP_KEY }}
        run: |
          missing=""
          [ -n "$ROLE" ] || missing="$missing AWS_DEPLOY_ROLE_ARN"
          [ -n "$INSTANCE" ] || missing="$missing NOOK_INSTANCE_ID"
          [ -n "$KAKAO" ] || missing="$missing KAKAO_MAP_KEY"
          if [ -n "$missing" ]; then echo "::error::리포 변수 없음:$missing"; exit 1; fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA 형식 아님: $SHA"; exit 1; }

      - name: AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL -o /tmp/awscli.zip https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install
          fi
          aws --version

      # 서드파티 액션 없이 OIDC → 임시 자격 증명(1시간). GitHub ID 토큰은 수명이 짧아 한 번만 교환하고 결과를 쓴다
      - name: AWS credentials (OIDC → nook-github-deploy)
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" \
            --role-session-name "gh-$GITHUB_RUN_ID" --web-identity-token "$token" \
            --duration-seconds 3600 --query Credentials --output json)
          ak=$(jq -r .AccessKeyId <<<"$creds"); sk=$(jq -r .SecretAccessKey <<<"$creds"); st=$(jq -r .SessionToken <<<"$creds")
          echo "::add-mask::$ak"; echo "::add-mask::$sk"; echo "::add-mask::$st"
          { echo "AWS_ACCESS_KEY_ID=$ak"; echo "AWS_SECRET_ACCESS_KEY=$sk"; echo "AWS_SESSION_TOKEN=$st"; } >> "$GITHUB_ENV"
          echo "REGISTRY=$(cut -d: -f5 <<<"$ROLE").dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"

      - name: ECR login / already pushed?
        id: exists
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          # nook-deploy 를 마지막에 push 한다 → 이게 있으면 4개 모두 있다. 태그 불변이라 재실행 때 다시 push 하면 거절된다
          if docker manifest inspect "$REGISTRY/nook-deploy:$SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 push 된 sha — 빌드를 건너뛰고 배포만 한다"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build arm64 images
        if: steps.exists.outputs.skip == 'false'
        env:
          KAKAO: ${{ vars.KAKAO_MAP_KEY }}
        run: |
          docker build -f deploy/api.Dockerfile --target api     -t "$REGISTRY/nook-api:$SHA" .
          docker build -f deploy/api.Dockerfile --target migrate -t "$REGISTRY/nook-migrate:$SHA" .
          docker build -f deploy/web.Dockerfile --build-arg NEXT_PUBLIC_KAKAO_MAP_KEY="$KAKAO" -t "$REGISTRY/nook-web:$SHA" .
          docker build -f deploy/deploy.Dockerfile -t "$REGISTRY/nook-deploy:$SHA" .
          docker image inspect "$REGISTRY/nook-api:$SHA" --format 'api arch={{.Architecture}}'

      # 배포할 바로 그 arm64 이미지를 스캔한다(ci.yml 은 x86 으로 스캔 — 그 숙제를 여기서 닫는다). nook-deploy 는 scratch 라 제외
      - name: Trivy scan (arm64)
        if: steps.exists.outputs.skip == 'false'
        run: |
          for img in nook-api nook-migrate nook-web; do
            echo "::group::$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress "$REGISTRY/$img:$SHA"
            echo "::endgroup::"
          done

      - name: Push to ECR
        if: steps.exists.outputs.skip == 'false'
        run: |
          for img in nook-api nook-migrate nook-web nook-deploy; do
            docker push --quiet "$REGISTRY/$img:$SHA"
          done
          docker logout "$REGISTRY"

      - name: Deploy via SSM (nook-deploy)
        env:
          INSTANCE: ${{ vars.NOOK_INSTANCE_ID }}
        run: |
          cid=$(aws ssm send-command --document-name nook-deploy --instance-ids "$INSTANCE" \
            --parameters "ImageTag=$SHA" --comment "github run $GITHUB_RUN_ID" \
            --query Command.CommandId --output text)
          echo "SSM command: $cid"
          status=Pending
          for _ in $(seq 1 90); do   # 최대 15분(문서 timeoutSeconds 900 과 같음)
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          echo "::group::서버 출력"
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" --query StandardErrorContent --output text
          echo "::endgroup::"
          echo "결과: $status"
          [ "$status" = Success ]
