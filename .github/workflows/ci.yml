# PR 게이트 — DEP 3단계, Claude 작성.
# 리포가 private + GitHub Free 라 브랜치 보호로 "통과해야 병합"을 강제할 수 없다(사용자 결정 2026-11-07).
# → 결과는 PR 에 체크로 보이고, 병합은 사람이 초록불을 보고 한다. main 직접 커밋은 로컬 훅(.githooks)이 막는다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소(Actions 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 — 코드 읽기만. 배포(8단계)는 별도 워크플로에서 OIDC 권한을 따로 준다
permissions:
  contents: read

jobs:
  api:
    name: api — build / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      # 경고도 막는다 — 로컬 기준(경고 0)을 CI 에서도 유지
      - run: dotnet build --no-restore -c Release -warnaserror
      # 통합 테스트는 Testcontainers 로 PostgreSQL 컨테이너를 띄운다(ubuntu 러너에 Docker 가 있다)
      - run: dotnet test --no-build -c Release

  web:
    name: web — typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # web.Dockerfile 의 node:24 와 같은 세대
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # lint 오류 = 실패(사용자 결정 2026-11-07). 경고는 통과
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # 운영 의존성만(--omit=dev). 브라우저·서버에 실리지 않는 개발 도구 취약점으로 PR 을 막지 않는다
      - name: npm audit (production deps)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      # dotnet 은 취약 패키지가 있어도 종료 코드 0 → JSON 에서 vulnerabilities 항목 수로 판정(출력 언어와 무관)
      - name: NuGet vulnerable packages (incl. transitive)
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive --format json > vuln.json
          count=$(jq '[.. | objects | .vulnerabilities? // empty | .[]] | length' vuln.json)
          echo "취약 항목: $count"
          if [ "$count" -ne 0 ]; then
            jq '.' vuln.json
            echo "::error::취약한 NuGet 패키지가 $count 건 있습니다"
            exit 1
          fi

  # DEP 게이트 3(2026-11-13 사용자 결정): 리포에 비밀값이 커밋되는 것을 막는다.
  # 이미지 Trivy secret 은 모양이 정해진 키(AKIA…·ghp_…)만 잡고 평문 DB 비밀번호는 놓친다(실측) → gitleaks(엔트로피 + 키워드)를 더한다.
  # 히스토리 전체를 매번 본다(커밋 약 250개에 5초) — PR 범위만 보면 강제 푸시·리베이스로 빠지는 커밋을 놓칠 수 있다.
  # 테스트 전용 키 같은 오탐은 루트 .gitleaksignore 에 지문(fingerprint)으로 등록한다(값이 아니라 위치를 등록).
  secrets:
    name: secrets — gitleaks (history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # 러너 사용자 uid 로 실행 — 다르면 git 이 '소유자가 다른 저장소(dubious ownership)'로 거부한다
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner --verbose

  images:
    name: images — build / Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v7
      # PR CI 는 러너 아키텍처(x86)로 빌드·스캔한다. 운영(t4g = arm64) 이미지는 main 병합 뒤 배포 작업(8단계)에서 빌드한다.
      # 이유(2026-11-09 사용자 결정): arm64 는 migrate 번들·web 이 QEMU 라 로컬 실측 각 약 14분(854s·861s) — PR 마다 기다리기엔 길다.
      # 대가: PR 에서 스캔한 이미지와 배포 이미지의 아키텍처가 다르다(같은 베이스라 OS 패키지 취약점은 거의 같지만 보장은 아님)
      #       → 배포 작업에서 arm64 이미지를 한 번 더 Trivy 로 스캔한다(8단계에 반영할 것).
      - name: Build images
        run: |
          docker build -f deploy/api.Dockerfile --target api     -t nook-api:ci .
          docker build -f deploy/api.Dockerfile --target migrate -t nook-migrate:ci .
          docker build -f deploy/web.Dockerfile                  -t nook-web:ci .
      # 고칠 버전이 나온(--ignore-unfixed) CRITICAL·HIGH 만 실패. 고칠 수 없는 것으로 PR 을 영구히 막지 않는다
      # trivy-action 대신 버전 고정한 공식 이미지를 직접 실행한다(서드파티 액션 태그 변조 위험을 줄임)
      - name: Trivy scan
        run: |
          # 비밀값(DEP 게이트 3, 2026-11-13 사용자 결정 "CI 상시"): 심각도 거르지 않음 — 이미지 안 비밀값은 고칠 버전을 기다릴 대상이 아니다
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --no-progress --exit-code 1 "$@"; }
          for img in nook-api:ci nook-migrate:ci nook-web:ci; do
            echo "::group::$img"
            trivy --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed "$img"
            trivy --scanners secret "$img"
            echo "::endgroup::"
          done
